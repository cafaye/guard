# openapi/v1.yaml — the HTTP contract for guard, the cafaye public gateway.
#
# guard is the only door into a cafaye deployment. This document is what a
# generated client is built from, and it is written to
# `cafaye/core: docs/openapi-conventions.md`. Where core and this file disagree,
# core is right and this file is the bug — and every such place is listed under
# "Open decisions" in the header below rather than left for a consumer to
# discover.
#
# ## What this document covers
#
# Every route `createApp` registers, in every configuration: the two probes, the
# `GET /v1/me` that proves the token chain is wired, and the four `/auth` browser
# routes. Seven operations, and nothing else.
#
# It does **not** describe the routing that guard is built to do. No request is
# proxied to a service yet, and the document does not pretend otherwise.
#
# ## The two kinds of thing `createApp` registers
#
# Hono records a route with its own method and every `app.use(…)` mount with the
# method `ALL`. There are exactly two mounts, and neither is an operation:
#
#   * `ALL /v1/*` — the prefix the bearer-token gate is mounted on, and the prefix
#     the routing packet will mount the pass-through to the services behind guard
#     on. It has no method, no response and no body of its own, so OpenAPI has
#     nothing to describe it as. **Excluded as that exact method+path pair** — not
#     as a `/v1/` prefix, which would cover every route the API surface gains from
#     here on. `GET /v1/me` is under that prefix and is in this document.
#   * `ALL /*` — the whole-app mounts: the API-key gate and the rate limiter. Two
#     gates, one key here, and a route at the root is a `GET` or a `POST`, so it
#     is not covered by either.
#
# `test/openapiDocument.test.ts` holds this file to `app.routes` in both
# directions, and holds the exclusion list to those two pairs: a mount that stops
# being mounted, or a mount this file stops mentioning, is a failing test rather
# than a carve-out quietly covering the next route.
#
# ## Errors
#
# Every non-2xx response is `application/problem+json` (RFC 9457) with core's
# `code` and `trace_id` extensions — **except** the `404` and the `500`, which
# are still the v0 `{ "error": …, "message": … }` envelope. That is a real
# conflict with core's conventions and it is open decision 5 below. Read the
# `Content-Type` to tell the two apart; nothing else distinguishes them.
#
# The problem shape is declared once, as `components.schemas.Problem`, and every
# error response references it. A document that only describes the happy path is
# the usual way an OpenAPI file becomes a lie, and refusing requests is most of
# what this service does.
#
# ## Rate limits are part of every counted response, not just the refusal
#
# The `RateLimit-*` and `X-RateLimit-*` families are on **every** answered
# response of a counted route — the `200` as much as the `429` — and they are
# declared on the success responses here for that reason. A client that renders a
# quota meter reads them from a `200`; a document that showed them only on the
# `429` would teach clients to notice them at the moment they were already
# throttled. The two probe operations are the exception and carry no `429` at
# all: a throttled probe is an orchestrator that cannot see a healthy process,
# and the restart that follows is worse than the traffic it was guarding.
#
# There is no RFC for these fields yet. The citation is the IETF HTTPAPI working
# group's Standards Track draft, `draft-ietf-httpapi-ratelimit-headers-11`, which
# builds on **RFC 9651** (Structured Field Values for HTTP) — not RFC 9331, which
# is L4S/ECN and has nothing to do with rate limiting. The un-prefixed trio
# (`RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`) is what that
# draft dropped in -08 and what deployed clients and proxies still parse, so
# guard sends both shapes rather than making a client guess.
#
# ## A counter store that cannot answer means no limit at all
#
# `RateLimitStore` fails **open**: if the store is unreachable, the request is
# served uncounted and the `RateLimit-*` fields are left off rather than guessed
# at, and `redis` shows up in `GET /readyz` as `unavailable`. A client must
# therefore treat a missing `RateLimit-Limit` as "this request was not counted"
# and not as zero.
#
# ## Open decisions — departures from cafaye/core docs/openapi-conventions.md
#
# Each is a manager decision rather than a local choice, and each is recorded
# here so a reviewer finds it rather than a consumer. The two already open in
# `cafaye.yml` — RS256 only, the `scope` claim, the default issuer, and the three
# extra error codes — are not repeated; this document describes what guard *does*,
# and `cafaye.yml` says where each departure from core still needs a ruling.
#
#  1. `exposes` is still absent from `cafaye.yml`.
#
#     core's manifest schema says a service that serves traffic must declare
#     `exposes.api` or `exposes.events`, and this repository serves traffic and
#     declares neither. The document the omission was waiting for now exists, and
#     `cafaye.yml` carries a `DECISION NEEDED` saying why: specs are manager-owned,
#     and pointing the whole platform's `caf gen` at a contract nobody has agreed
#     to is the manager's call, not a worker's. Every other service in the fleet
#     that publishes a document points `exposes.api` at it. Requested: the manager
#     adds `exposes: { api: openapi/v1.yaml }`, or says why not.
#
#  2. Four operations are not under `/v1`.
#
#     core's versioning section requires every path in this document to sit under
#     a single `/vN` prefix. `/auth/register`, `/auth/login`, `/auth/logout`,
#     `/auth/me`, `/healthz` and `/readyz` are not, and cannot be: they are
#     either the browser surface, which core's own auth section calls "a
#     *different* surface, not an API exception", or the infrastructure probes,
#     whose paths are conventional rather than ours to choose. `GET /v1/me` is the
#     only API-surface operation, and it is a placeholder the routing packet
#     replaces. Requested: either core's `/v1` rule gets an explicit carve-out
#     for a BFF and for probes, or the browser surface is renamed under `/v1` and
#     the two rule-menders are the same decision.
#
#  3. The API key is not a bearer JWT.
#
#     core's auth section says "Bearer JWTs only". guard also accepts
#     `Authorization: ApiKey caf_…` for a machine credential: 32 CSPRNG bytes
#     stored as a SHA-256 digest, revocable on the next request. A self-contained
#     JWT cannot be revoked before its `exp`, and a long-lived API key that is
#     only as revocable as its own expiry is not a machine credential, it is a
#     password with a longer memory. It is declared here as an `apiKey` in the
#     `Authorization` header rather than as an `http`/`bearer` scheme, because
#     `ApiKey` is not one of RFC 7235's registered authentication schemes and
#     writing it as one would be a smaller lie than writing it as an apiKey-in-a-
#     header. Requested: an entry in core's auth section for machine credentials
#     that are revocable.
#
#  4. The browser surface has no CSRF token.
#
#     core's auth section pairs the `Secure`/`HttpOnly`/`SameSite=Lax` cookie with
#     "and a CSRF token". guard sends the cookie with all three attributes and
#     gates every mutating `/auth` route on `Sec-Fetch-Site: same-origin`, falling
#     back to comparing the `Origin` header's host. A request carrying neither is
#     refused. That is a real defence and it is not a double-submit token: a token
#     would be a second thing to get right for the same protection, and the OIDC
#     packet replaces this login with an authorization-code flow where the state
#     parameter *is* the token. Recorded as a gap rather than a settled question,
#     because the two are not the same thing and a reader deciding which one guard
#     has is a reader who is wrong about one of them.
#
#  5. `404` and `500` are not problem documents.
#
#     They answer `{ "error": "not_found", "message": … }` and
#     `{ "error": "internal_error", "message": … }` with `application/json`, and
#     guard therefore produces **no** `not_found` or `internal` problem code at
#     all. core says every non-2xx is `application/problem+json` and reserves both
#     slugs. The reason it is still so: the envelope's `trace_id` must equal an
#     `X-Trace-Id` on *every* response, which is a trace-propagation middleware
#     that does not exist yet, and the `README` carries this as an open packet.
#     Nothing here describes the route guard ought to have. Requested: a packet
#     that adds trace-id propagation and moves `404`/`500` onto the envelope in
#     one go.
#
#  6. `GET /readyz`'s `503` is `application/json`, not a problem document.
#
#     A failing probe has to say *which* dependency failed, and the problem
#     envelope has nowhere to put a dependency list — that list is the entire
#     value of a readiness answer to whoever is reading a failing one. The
#     underlying error goes to the log and never to an unauthenticated caller,
#     because an error message can carry a host, a port or a query. `identity`
#     records the identical conflict, so the ruling should be fleet-wide: either
#     core's envelope grows a place for probe diagnostics, or `/readyz` is scoped
#     out of the client contract as an operational endpoint. The first is a core
#     change and the second is a manifest change, and both are core's call.
#
#  7. `Idempotency-Key` is not accepted on `POST /auth/register`.
#
#     core's checklist requires it on every safely-retryable mutating `POST`. A
#     registration is safely retryable in the sense that matters — a client that
#     never saw the `201` should be able to try again — so this operation owes the
#     header, and does not have it. Not stubbed: honouring the key needs a
#     retention table, a request-body hash, the `(endpoint, principal, key)`
#     scoping and the replay-versus-reuse `409`, and a version that accepts the
#     header and ignores it is worse than one that does not claim it.
#     `POST /auth/login` is a deliberate exception and always will be, exactly as
#     in `identity`: a login is not safely repeatable, since retrying it mints a
#     second session rather than returning the first.
openapi: 3.1.0

info:
  title: cafaye guard
  # This is a new document, so it starts at 1.0.0 and there is no compatibility
  # promise to keep. It is the document's own semantic version and it follows
  # guard's release line, not the `/v1` prefix: the two answer different
  # questions, and core's sync rule asks for both.
  #
  # Non-breaking additions bump this and nothing else. A breaking change bumps the
  # `/v1` prefix and this in the same commit, and `/v1` is never mutated in place.
  version: 1.0.0
  summary: The cafaye public gateway — authentication, rate limits, and the browser sign-in surface.
  description: |
    `guard` is the only door into a cafaye deployment. It authenticates callers,
    limits what they can ask for, and — once the routing packet lands — forwards
    requests to the service that owns the work. It holds no business data and
    publishes no events.

    ## Two surfaces, two credentials, and they do not cross

    **`/v1/*` is the API surface.** A bearer JWT verified locally against
    `identity`'s published JWKS, or an API key. Never a cookie. A request with
    neither is `401` before any handler runs, and the `/v1/*` mount is what makes
    that true for every route on the prefix rather than for the ones somebody
    remembered to extend.

    **`/auth/*` is the browser surface.** A session id in a `__Host-bff-session`
    cookie that guard minted, swapped for the identity token server-side when a
    request needs one. A browser never sees that token, and never sees identity's
    endpoints at all. The mutating routes additionally require the request to be
    provably same-origin.

    ## Refusing is the job, so the refusals are documented

    A `401` says "this token is not acceptable". A `503` says "we cannot tell",
    and guard never collapses the two: if `identity`'s key set cannot be fetched,
    the caller's credential was not the problem, and a `401` would send them to
    fix something that is fine.

    A `429` is core's error envelope like every other rejection, and it carries
    the whole rate-limit header family so a client can pace itself rather than
    discover the limit by being cut off.

    ## The rate limiter is a sliding window, and a window that is exhausted fails open

    The allowance is spent continuously, because a fixed window hands out twice
    the limit across its boundary in two milliseconds. Under a sliding window a
    caller pacing itself at exactly its allowance holds a **constant** `remaining`:
    there is no aligned edge to count down to, and `RateLimit-Reset` counts down
    to the replenishment rather than to the end of a bucket.

    The bucket is the strongest identity the request has — verified account id,
    then API key id, then client address — and never weaker, which is why the
    limiter is mounted *after* the auth gates. A token that does not verify is
    answered `401` and is counted against nothing. That is affordable only because
    a rejected token costs no key fetch: the algorithm is read off the protected
    header before anything is fetched, so an `alg: none` or HS256 token never
    reaches a verifier and never makes guard call `identity`.

    Counters are per process unless `REDIS_URL` names a shared store, so N
    replicas of the in-memory store is an N-times limit. See the header on
    `RateLimit-Limit` for what to do about a field that is absent.

    ## Nothing is proxied yet

    `GET /v1/me` is the operation that proves the auth chain is wired end to end:
    no behaviour of its own, and it forwards nothing. The routing packet replaces
    it with real traffic, and this document grows with it.
  contact:
    name: guard
    url: https://github.com/cafaye/guard
    email: guard@cafaye.com
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://api.cafaye.com
    description: production
  - url: http://localhost:8080
    description: local development (docker compose up)

tags:
  - name: probes
    description: |
      Liveness and readiness. Consumed by orchestrators, not by clients, and the
      only two operations exempt from rate limiting.
  - name: api
    description: |
      The API surface. A bearer JWT or an API key, never a cookie.
  - name: browser
    description: |
      The BFF surface. A `__Host-` session cookie guard minted, and — on the
      mutating routes — a request that is provably same-origin.

paths:
  /healthz:
    get:
      tags: [probes]
      operationId: liveness
      summary: Liveness
      description: |
        Answers whether this process is running. It touches no dependency and
        reads nothing, so an `identity` or Redis outage cannot get the process
        restarted out from under in-flight requests — that is `/readyz`'s job and
        the split between the two is the point of having two.

        Never rate limited, and never authenticated. An orchestrator asking
        whether the process is alive has no credential and must not be throttled
        into a restart.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalError'

  /readyz:
    get:
      tags: [probes]
      operationId: readiness
      summary: Readiness
      description: |
        Answers whether this process can serve traffic, by probing each named
        dependency. In a stock deployment `deps` carries `identity`, and `redis`
        as well when `REDIS_URL` is set.

        A dependency that throws, rejects, hangs, or answers with anything but
        `"ok"` is **one** unavailable dependency. None of them may take the
        process down, and a `503` here is the whole contract of this endpoint.

        Which dependency failed is named. *Why* it failed is not: the underlying
        error goes to the log, because an unauthenticated request must not be a
        way to learn that a dependency's host sits at a particular address.

        The `503` body is `application/json` and not core's problem document,
        which is a recorded conflict — see open decision 6 in the header.
      security: []
      responses:
        '200':
          description: Every dependency answered `"ok"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                deps:
                  identity: ok
        '503':
          description: |
            At least one named dependency did not answer. The value is
            `"unavailable"` for every one that did not, and the reason is in the
            process's log rather than in this body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                deps:
                  identity: ok
                  redis: unavailable
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      tags: [api]
      operationId: getCurrentPrincipal
      summary: The verified principal
      description: |
        Resolves the presented credential and returns what guard proved about the
        caller: the `sub`, the scopes, the account, and the claims themselves.

        This is the operation that exists to prove the auth chain is wired end to
        end. It has no behaviour of its own and it forwards nothing; the routing
        packet replaces it with real traffic.

        A missing, malformed, expired, wrongly-signed, wrongly-issued or
        wrongly-addressed token, and an API key that is unknown or withdrawn, are
        all **one** `401` with one body. Which of the four it was is not something
        a caller learns by trying.

        **A `503`, never a `401`, when `identity` is unreachable.** The signing
        keys could not be fetched, so guard cannot tell whether the token is good;
        a `401` would send a caller to rotate a credential that was fine.
      security:
        - bearerToken: []
        - apiKeyCredential: []
      responses:
        '200':
          description: The verified principal.
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
              example:
                sub: ab000000-0000-0000-0000-000000000000
                scope: [invoices:write]
                accountId: cd000000-0000-0000-0000-000000000000
                claims:
                  iss: https://identity.localhost
                  aud: guard
                  sub: ab000000-0000-0000-0000-000000000000
                  account_id: cd000000-0000-0000-0000-000000000000
                  scope: invoices:write
                  exp: 1790880000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/register:
    post:
      tags: [browser]
      operationId: registerUser
      summary: Register an account
      description: |
        Creates an account through `identity` and returns the two fields a
        browser needs. **No session is created**: a registration is not a login,
        and the caller signs in separately with `POST /auth/login`.

        The body is forwarded to `identity` **verbatim**. guard decides only
        whether it is a JSON object and whether it is under 4 KiB; whether the
        address is deliverable and the password strong enough is `identity`'s
        call, under the same rules every other client of `identity` gets. A second
        set of rules in the gateway would be a second answer to "what is a valid
        password".

        This is the only operation in the gateway that reveals whether an address
        is already registered, and it answers `409`. Everywhere else, "no such
        account" and "wrong password" are indistinguishable.

        Requires a provably same-origin request: `Sec-Fetch-Site: same-origin`, or
        an `Origin` header naming this host. See open decision 4 in the header.
      security: []
      parameters:
        - $ref: '#/components/parameters/SecFetchSite'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: kaka@example.com
              password: correct horse battery staple
      responses:
        '201':
          description: The account was created. No cookie is set.
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: ab000000-0000-0000-0000-000000000000
                email: kaka@example.com
        '400':
          $ref: '#/components/responses/MalformedBody'
        '403':
          $ref: '#/components/responses/NotSameOrigin'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/login:
    post:
      tags: [browser]
      operationId: createSession
      summary: Log in
      description: |
        Exchanges an email and a password for a session id in a
        `__Host-bff-session` cookie.

        **The response body carries `expires_at` and nothing else.** The identity
        token is never echoed to the page: a token in a page is a token a
        cross-site script can read, which is the entire reason this surface
        exists. The cookie is `Secure`, `HttpOnly`, `SameSite=Lax` and `Path=/`,
        with no `Domain`; the `__Host-` prefix is a contract the browser
        enforces, and it is what stops a sibling or subdomain origin from setting
        or overwriting the cookie.

        The session id is minted here and is never accepted from the caller.
        Session fixation needs an id the attacker knows first.

        A wrong password and an unregistered address are **one** `401` with one
        body, and comparable time. A locked account is `423` with `Retry-After`,
        and the window travels with the answer — collapsing it into the `401`
        would tell somebody with the right password to try again and be refused
        again for a quarter of an hour.

        Requires a provably same-origin request. See open decision 4 in the
        header.
      security: []
      parameters:
        - $ref: '#/components/parameters/SecFetchSite'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: kaka@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: |
            The credentials were correct and a session now exists. The body says
            when it runs out; the cookie is how the browser presents it.
          headers:
            Set-Cookie:
              description: The `__Host-bff-session` cookie, or absent for a client that ignores cookies.
              schema:
                type: string
              example: '__Host-bff-session=…; Path=/; Secure; HttpOnly; SameSite=Lax'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                expires_at: '2026-09-30T12:00:00Z'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          description: |
            The credentials were refused. The body is identical whether the
            address is unregistered or the password is wrong, and says nothing
            about which.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/unauthorized
                title: Unauthorized
                status: 401
                detail: email or password is not correct
                instance: /auth/login
                code: unauthorized
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '403':
          $ref: '#/components/responses/NotSameOrigin'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '423':
          $ref: '#/components/responses/AccountLocked'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/logout:
    post:
      tags: [browser]
      operationId: deleteSession
      summary: Log out
      description: |
        Revokes the session the presented cookie names, and clears it. **The
        local session is dropped first, on purpose:** failing to sign a browser
        out is worse than a token that outlives its revocation until its `exp`.

        If `identity` cannot be told, this is still a `204` and the cookie is
        still cleared — the local session is gone and the browser is signed out of
        this gateway. The `503` is only reached when the local drop itself did not
        happen, and the detail says the revocation is unconfirmed rather than
        leaving the caller to assume it.

        A cookie the store has forgotten is `204`, not `401`: the browser is not
        signed in, there is provably nothing to revoke, and refusing is what makes
        sign-out look broken.

        Requires a provably same-origin request.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SecFetchSite'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The session is gone and the cookie is cleared. No body.
          headers:
            Set-Cookie:
              description: An expired `__Host-bff-session` cookie, repeating every attribute the setting cookie had.
              schema:
                type: string
              example: '__Host-bff-session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotSameOrigin'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/me:
    get:
      tags: [browser]
      operationId: getCurrentUser
      summary: The signed-in account
      description: |
        Resolves the session cookie through `identity` and returns the account it
        belongs to. Neither the identity token nor the session id appears in the
        response, and neither appears in a log line.

        Not gated on origin: a `GET` changes nothing, and demanding an `Origin`
        header from it would protect nothing. The gate is per route, on the
        mutating ones.

        A cookie whose session is gone is `401` **and the cookie is cleared**,
        so a browser stops re-sending a credential that can never work again. A
        session `identity` has withdrawn is `401` too, and the record is dropped
        so that is true from this request on rather than at the token's expiry.

        An `identity` **outage** is `503` and the session survives it. That is not
        a revocation, and treating it as one would sign every signed-in user out
        whenever `identity` hiccups.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in account.
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: ab000000-0000-0000-0000-000000000000
                email: kaka@example.com
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The API surface. An RS256 JWT issued by `identity` and verified locally
        against its published JWKS, cached by `kid` with a bounded TTL.

        **RS256 only.** `alg: none`, HS256 and anything the key set does not
        advertise are refused — and refused on the *protected header*, before any
        key is fetched, so a forged token costs no network call and never aims
        traffic at `identity`. The accepted algorithm is one constant in
        `src/middleware/jwt.ts`, never something a token can widen. core's
        conventions also allow ES256; widening is a one-line change and belongs
        with the moment `identity` publishes ES256 keys.

        Required claims: `iss` (the configured issuer), `aud` (guard's own client
        id), `sub`, and `exp`. The capability claim is a space-separated `scope`
        string — not core's `scopes` — and an absent `scope` is an empty set,
        never everything. Both are open in `cafaye.yml`.
    apiKeyCredential:
      type: apiKey
      in: header
      name: Authorization
      description: |
        A machine credential for an account, presented as
        `Authorization: ApiKey caf_<43 base64url characters>`. Declared as an
        `apiKey` in the `Authorization` header rather than as an `http` scheme
        because `ApiKey` is not one of RFC 7235's registered schemes.

        32 bytes from the platform CSPRNG. Only its SHA-256 is stored, only its
        first twelve characters are ever displayed, and it is shown exactly once —
        at issue. A revocation takes effect on the very next request, and an
        unknown key and a withdrawn key are one refusal, because telling them
        apart would confirm that a guessed key once existed.

        The scopes on a key are in the same vocabulary as a token's `scope`, and
        the key sets the same principal: everything downstream treats the two
        credentials as the same caller.

        Nothing in guard hands a key out yet — see "Not built yet" in the
        repository README. A client holding one today is talking to a deployment
        that issued it out of band.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-bff-session
      description: |
        The browser surface, and the "different surface" core's auth section
        describes rather than an exception to "no cookies for API traffic". A
        `__Host-` cookie is accepted by the browser only when it is `Secure`, has
        `Path=/` and carries no `Domain`, which binds it to this origin.

        The value is a session id, **not** a credential `identity` recognises. It
        is useless anywhere but this gateway, and this gateway swaps it for the
        identity token server-side.

  parameters:
    SecFetchSite:
      name: Sec-Fetch-Site
      in: header
      required: false
      description: |
        Fetch metadata, set by the user agent and not by the page, so it is an
        assertion no cross-site requester can make. **A mutating `/auth` route
        requires it to be exactly `same-origin`, or an `Origin` header naming
        this host; a request carrying neither is `403`.**

        Both are declared optional because the requirement is a disjunction, and
        one `required: true` parameter cannot express "one of these two".
      schema:
        type: string
        enum: [same-origin, same-site, cross-site, none]
    Origin:
      name: Origin
      in: header
      required: false
      description: |
        The fallback for a user agent that sends no fetch metadata. Compared by
        **host, not by origin**, so a TLS-terminating proxy rewriting the scheme
        guard sees does not lock out every real browser. `Origin: null` is refused.
      schema:
        type: string

  headers:
    TraceId:
      description: |
        Correlates this response with the process's logs. Present on every
        problem document and always equal to the `trace_id` in its body, so
        support starts from that id.

        **Absent on a `2xx` and on the v0 `404`/`500`.** guard does not yet
        propagate a trace id across every response, which is one half of why those
        two statuses are not problem documents — see open decision 5.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 0af7651916cd43dd8448eb211c80319c
    RateLimitPolicy:
      description: |
        `draft-ietf-httpapi-ratelimit-headers` §3: the quota policy, as a
        structured-field List of Items. The policy name as a String, `q` for the
        quota, `w` for the window in seconds.

        The name is half the counter key, so two policies never share a bucket:
        exhausting `guard-auth-login` cannot spend the `guard-api` allowance.
      schema:
        type: string
      example: '"guard-api";q=600;w=60'
    RateLimit:
      description: |
        §4: the quota currently available under that policy — `r` for the
        available quota and, per §4.1.2, `t` for the **effective window**, the
        seconds within which the available quota may be used.

        `t` is a countdown to the replenishment and not a copy of `w`. The window
        slides, so a caller pacing itself at exactly its allowance holds a constant
        `r`; nothing here is a countdown to a fixed edge, and a client that reads
        one will believe there is burst room the limiter then refuses.
      schema:
        type: string
      example: '"guard-api";r=598;t=44'
    RateLimitLimit:
      description: The un-prefixed trio the -11 draft dropped in -08, kept because deployed clients and proxies still parse it.
      schema:
        type: integer
        minimum: 0
      example: 600
    RateLimitRemaining:
      description: Requests still available under this policy in this window. `0` on a `429`.
      schema:
        type: integer
        minimum: 0
      example: 598
    RateLimitReset:
      description: Seconds counting down to the replenishment. Agrees with `RateLimit`'s `t` by construction.
      schema:
        type: integer
        minimum: 0
      example: 44
    XRateLimitLimit:
      description: |
        This repository's own field, from before the draft existed: the same
        number as `RateLimit-Limit`.
      schema:
        type: integer
        minimum: 0
      example: 600
    XRateLimitRemaining:
      description: The same number as `RateLimit-Remaining`.
      schema:
        type: integer
        minimum: 0
      example: 598
    XRateLimitReset:
      description: |
        **An absolute epoch instant in milliseconds**, not a countdown, because a
        client that wants a wall-clock deadline should not have to reconstruct one
        from a delta. Deliberately different from `RateLimit-Reset`.

        **Every `RateLimit-*` and `X-RateLimit-*` field is absent when the counter
        store could not be reached.** The limiter fails open: the request is served
        uncounted rather than handing a Redis outage to every caller as a `429`.
        Treat an absent field as "this request was not counted", never as zero.
      schema:
        type: integer
      example: 1784557432104
    RetryAfter:
      description: |
        Seconds until this request would next be admitted. **Never `0`**, because
        `Retry-After: 0` tells a client to come straight back into a bucket that
        cannot open for another few hundred milliseconds. RFC 9110 §10.2.3; §7 of
        the rate-limit draft makes this the field to read when it and `Reset` are
        both present.
      schema:
        type: integer
        minimum: 1
      example: 44

  schemas:
    Problem:
      type: object
      description: |
        The cafaye error envelope: RFC 9457 plus core's `code` and `trace_id`.
        Every rejection on this surface is this shape — **except** the `404` and
        the `500`, which are `V0Error` with `application/json`. Read the
        `Content-Type` to tell them apart; nothing else does.

        `detail` is a fixed string per case and is not parsed by clients. It never
        contains an internal reason, a host, a port or a query fragment: those go
        to the log under the same `trace_id`, because a problem document is read by
        the caller.
      required: [type, title, status, detail, instance, code, trace_id]
      properties:
        type:
          type: string
          format: uri
          description: 'A stable `https://errors.cafaye.com/<code>` URI — the machine-readable contract.'
          example: https://errors.cafaye.com/validation_failed
        title:
          type: string
          description: A fixed human-readable summary for the code. May be reworded without a version bump.
        status:
          type: integer
          description: The HTTP status, repeated in the body.
          enum: [400, 401, 403, 409, 413, 422, 423, 429, 503]
        detail:
          type: string
          description: Specific to this occurrence and not parsed by clients.
          example: too many requests for this window
        instance:
          type: string
          description: |
            The request path, and **never the query** — a caller who put a
            credential in the query should not find it echoed back in an error body.
          example: /v1/me
        code:
          type: string
          description: The last segment of `type`, in snake_case.
          enum:
            - unauthorized
            - forbidden
            - unavailable
            - invalid_json
            - conflict
            - validation_failed
            - account_locked
            - payload_too_large
            - rate_limited
            # core's reserved list also carries `not_found` and `internal`. guard
            # does not produce either: the `404` and the `500` are still the v0
            # `V0Error` envelope, so listing them here would be a code no response
            # can carry. See open decision 5 in the header.
        trace_id:
          type: string
          description: Always present, and always equal to the `X-Trace-Id` response header.
          pattern: '^[0-9a-f]{32}$'
        errors:
          type: array
          description: Per-field failures. **Present only on a `422`**, as core scopes it.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: The request field that failed. Named exactly as `identity` named it.
        code:
          type: string
          description: A stable slug, safe to switch on.
          example: too_short

    V0Error:
      type: object
      description: |
        The v0 error shape, and the only non-problem body guard still writes.
        It is what the `404` and the `500` answer, with `application/json`.

        Recorded as a conflict with core's conventions rather than quietly fixed:
        moving these two onto the envelope needs trace-id propagation on every
        response first. See open decision 5 in the header. A client must branch on
        `Content-Type`, not on the shape of the body.
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_found, internal_error]
        message:
          type: string
          description: A fixed string. It never contains an internal reason, a host or a port.

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      description: |
        One entry per **registered** dependency, by name. `identity` is registered
        in every deployment guard has an identity for; `redis` is registered when
        `REDIS_URL` is set. An app built with no probes at all answers `{}`.

        The keys are guard's configuration rather than a client's: a deployment
        with a new dependency grows this object, which is a non-breaking change.
        Read it as "the names I know about", and treat an unknown name as a
        dependency whose state is unknown rather than as a healthy one.
      additionalProperties: false
      required: [deps]
      properties:
        deps:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            identity: ok
            redis: unavailable

    Principal:
      type: object
      description: |
        What guard proved about the caller, and the whole of what a handler is
        allowed to read. There is no endpoint anywhere in this repository that
        returns a token, a digest or a session id.
      additionalProperties: false
      required: [sub, scope, claims]
      properties:
        sub:
          type: string
          description: |
            The user id from `sub`, or — for an API key — the account id, because
            a key *is* the account.
        scope:
          type: array
          description: |
            The `scope` claim, split on whitespace. **An absent claim is an empty
            array, never everything**: a scope gate that treated "no scopes" as
            "all scopes" would be a gate with no gate.
          items:
            type: string
          example: [invoices:write]
        accountId:
          type: string
          description: |
            The account the request acts on, from the `account_id` claim. **Absent
            for a token with no such claim**, which is not an error — a user with
            no workspace is the account — and it is also the rate-limit bucket, so
            its absence widens a bucket rather than narrowing one.
        claims:
          type: object
          description: |
            The verified claims themselves, unfiltered. `exp`, `iat`, `jti` and
            whatever else `identity` put in the token is here, and this is the
            only place in the API surface where that is true.
          additionalProperties: true

    User:
      type: object
      description: |
        The public projection of an account: exactly two fields, always. An
        allowlist rather than a filter, so a field `identity` adds next month
        cannot reach a browser response today by being copied through.
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    RegisterRequest:
      type: object
      description: |
        Forwarded to `identity` **verbatim**. guard checks only that the body is a
        JSON object and that it is under 4 KiB; the fields below are the ones
        `identity` reads, and it is the only thing in the platform that decides
        whether they are acceptable.

        `additionalProperties` is open on purpose. guard does not validate and
        does not filter, so a client sending a field `identity` understands is
        working; a client sending a field nobody understands gets `identity`'s
        answer.
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          description: |
            A password `identity` will accept, hashed with argon2id. The bounds
            here are the transport's, not a policy: guard does not have a password
            policy and will not grow one, because a second set of rules in the
            gateway is a second answer to "what is a valid password".

    LoginRequest:
      type: object
      description: Forwarded to `identity` verbatim, as `RegisterRequest` is.
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          description: |
            `minLength: 1` and not 8. A login is not a registration, and refusing
            to check a short password would be a way to learn which passwords are
            in use.

    LoginResult:
      type: object
      description: |
        When the session runs out, and nothing else.

        **There is no token field here, and adding one would be the bug this
        document exists to prevent.** The identity token lives in guard's session
        store and is never echoed to a page, because a token in a page is a token
        a cross-site script can read.
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
          description: |
            RFC 3339 UTC, taken from the expiry `identity` minted rather than from
            a guard-side TTL. `identity` decides how long a session is good for,
            and a second clock here would be a second answer.

  responses:
    Unauthenticated:
      description: |
        No usable credential: none was presented, or it is malformed, expired,
        signed by an unknown key, issued by the wrong issuer, addressed to the
        wrong audience, unknown as an API key, or withdrawn. **One body for every
        one of them** — telling them apart is what turns a login endpoint into an
        account-enumeration oracle.

        Never returned because a *dependency* is down. That is `503`, so a caller
        is never sent to rotate a credential that was fine.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/unauthorized
            title: Unauthorized
            status: 401
            detail: a bearer token is required
            instance: /v1/me
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotSameOrigin:
      description: |
        The request is not provably from this origin, and the route changes
        something. Refused on `Sec-Fetch-Site` other than `same-origin`, on an
        `Origin` naming another host, and on a request carrying **neither** — an
        unstated origin is not a same-origin one.

        A valid session cookie does not make a cross-origin `POST` work.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/forbidden
            title: Forbidden
            status: 403
            detail: this request is not from the same origin
            instance: /auth/login
            code: forbidden
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Throttled:
      description: |
        The allowance for this policy is spent. A sliding-window limiter, so this
        is the allowance being used up rather than a bucket that emptied at a
        wall-clock edge.

        The whole header family is here, not just on a success, because a client
        that has to back off is exactly the client that needs to read them.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/rate_limited
            title: Too many requests
            status: 429
            detail: too many requests for this window
            instance: /v1/me
            code: rate_limited
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Unavailable:
      description: |
        **"We cannot tell", never "your credential is wrong."** A dependency
        guard needs did not answer: `identity`'s signing keys, `identity`'s auth
        routes, or the API-key store.

        Collapsing this into a `401` is the specific mistake this status exists to
        prevent — it sends a caller to fix a credential that was fine, and it
        makes a credential outage look like a credential problem.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/unavailable
            title: Service unavailable
            status: 503
            detail: the signing keys could not be retrieved
            instance: /v1/me
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c

    MalformedBody:
      description: |
        The body is not a JSON object, or is not JSON at all. `identity` is never
        called, because there is nothing to forward.

        A `400` and not a `422`, as core's status conventions reserve: this is
        malformed syntax the client could not have known about, not a request that
        was understood and refused.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/invalid_json
            title: Invalid request
            status: 400
            detail: the request body must be a JSON object
            instance: /auth/login
            code: invalid_json
            trace_id: 0af7651916cd43dd8448eb211c80319c

    BodyTooLarge:
      description: |
        The body is over 4 KiB. The cap is enforced while reading, not after, so
        an unauthenticated caller cannot choose how much of this process one
        request holds; a declared `Content-Length` over the cap is refused from
        the header alone.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/payload_too_large
            title: Payload too large
            status: 413
            detail: the request body is larger than 4096 bytes
            instance: /auth/register
            code: payload_too_large
            trace_id: 0af7651916cd43dd8448eb211c80319c

    ValidationFailed:
      description: |
        The request was understood and is not acceptable, and `errors[]` names
        the fields. The failures are `identity`'s, passed through only when they
        are shaped like core's — a field name is data a browser renders, so it is
        not a place to accept an arbitrary document.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/validation_failed
            title: Validation failed
            status: 422
            detail: the request has an invalid field
            instance: /auth/register
            code: validation_failed
            trace_id: 0af7651916cd43dd8448eb211c80319c
            errors:
              - field: password
                code: too_short

    Conflict:
      description: |
        An account already exists for that address. The only operation in the
        gateway that reveals whether an address is registered.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/conflict
            title: Conflict
            status: 409
            detail: an account already exists for that email address
            instance: /auth/register
            code: conflict
            trace_id: 0af7651916cd43dd8448eb211c80319c

    AccountLocked:
      description: |
        Too many consecutive failed sign-in attempts. `identity` owns the
        lockout; guard carries the remaining window through rather than collapsing
        it into the `401` above, because that would tell somebody with the right
        password to try again and be refused again for a quarter of an hour.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Retry-After:
          description: Seconds until the account may be tried again. Whole seconds, never negative.
          required: true
          schema:
            type: integer
            minimum: 0
          example: 900
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/account_locked
            title: Account locked
            status: 423
            detail: too many failed sign-in attempts for this account
            instance: /auth/login
            code: account_locked
            trace_id: 0af7651916cd43dd8448eb211c80319c

    InternalError:
      description: |
        The request could not be completed. The cause — a host, a port, a query, a
        token — is in the process's log under the returned `trace_id` and is never
        in the response.

        **The one response in this document that is not a problem document.**
        guard's `onError` still answers the v0 `V0Error` shape with
        `application/json`, because the envelope's `trace_id` would have to match
        an `X-Trace-Id` on every response and that propagation does not exist yet.
        See open decision 5 in the header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/V0Error'
          example:
            error: internal_error
            message: unexpected server error
