# Toolchain pins for guard. The worktree and CI must agree, so the versions
# live here rather than in whatever the machine happens to have installed.
#
# bun 1.3.12 is the same number as the oven/bun base image in the Dockerfile and
# the `packageManager` field in package.json. `engines.bun` is a floor, not a
# pin: `>=1.3.0` is satisfied by 1.3.12 and by 1.9.0 alike, so it says who may
# run this rather than which one ran. mise is optional, which is why the pin is
# in package.json too — a contributor without mise must still get the runtime CI
# tested, and `src/pins.test.ts` is what keeps the copies from drifting apart.
[tools]
bun = "1.3.12"
node = "22.12.0"

[env]
# Keeps `bun run` and `bunx` from inheriting a NODE_ENV that silently changes
# which dependency tree a script sees.
NODE_ENV = "development"
